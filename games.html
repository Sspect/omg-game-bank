<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        .game-card {
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 300px;
            border: 0;
        }

        .game-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            pointer-events: none;
        }

        .game-card .card-body {
            position: relative;
            z-index: 1;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 300px;
        }

        .game-card .list-group-item {
            background: transparent;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.28);
        }

        .game-card .text-body-secondary {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .game-card a {
            color: #d7f1ff;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
                aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggler">
                <ul class="navbar-nav me-auto mb-2">
                    <li class="nav-item me-2">
                        <a href="../index.html" class="btn btn-outline-secondary" type="button">Home</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="games.html" class="btn btn-outline-secondary" type="button">Games</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="about.html" class="btn btn-outline-secondary" type="button">About</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="add-game.html" class="btn btn-outline-secondary" type="button">Add Game</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="sign-in.html" class="btn btn-primary" type="button">Sign In</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="sign-in.html" class="btn btn-danger" type="button">Sign Out</a>
                    </li>

                </ul>
            </div>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            </form>
        </div>
    </nav>
    <main class="container py-4">
        <section class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <h2 class="h5 mb-0">Choose What To Display</h2>
                    <div class="d-flex gap-2">
                        <button id="selectAllDisplayFields" type="button" class="btn btn-sm btn-outline-light">Select All</button>
                        <button id="deselectAllDisplayFields" type="button" class="btn btn-sm btn-outline-secondary">Deselect All</button>
                    </div>
                </div>
                <div id="displayFieldControls" class="row g-2"></div>
            </div>
        </section>

        <section id="gamesList" class="row g-3"></section>
    </main>
    <script type="module" src="js/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>

</html>
