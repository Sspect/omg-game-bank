<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler"
                aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggler">
                <ul class="navbar-nav me-auto mb-2">
                    <li class="nav-item me-2">
                        <a href="../index.html" class="btn btn-outline-secondary" type="button">Home</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="games.html" class="btn btn-outline-secondary" type="button">Games</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="about.html" class="btn btn-outline-secondary" type="button">About</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="add-game.html" class="btn btn-outline-secondary" type="button">Add Game</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="sign-in.html" class="btn btn-primary" type="button">Sign In</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="sign-in.html" class="btn btn-danger" type="button">Sign Out</a>
                    </li>

                </ul>
            </div>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            </form>
        </div>
    </nav>

        <main class="container py-4">
            <h1 class="h3 mb-3">Sign In</h1>
            <form class="card p-3 p-md-4 shadow-sm" autocomplete="on">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required />
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
