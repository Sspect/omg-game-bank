<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <script type="module" src="mvp.js"></script>
        <h1>Game Bank</h1>

        <form id="gameForm">
            <h2>Add New Game</h2>
            <input type="text" id="gameName" placeholder="Game Name" required />
            <input
                type="number"
                id="minPlayers"
                placeholder="Min Players"
                required
            />
            <input
                type="number"
                id="maxPlayers"
                placeholder="Max Players"
                required
            />
            <button type="button" id="addGameBtn">Add Game</button>
            <button type="button" id="datasett">Delete and add datasett</button>
        </form>

        <div id="gamesList"></div>
    </body>
</html>
