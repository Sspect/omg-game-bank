<!DOCTYPE html>
<html>
<head>
  <title>OMG Game Viewer</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Game Info</h1>
  <div id="game"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDD5N3pIoZrQ9KT-d9Xiq9U0sAGlJKXqPk",
      authDomain: "oslometgaming-58efa.firebaseapp.com",
      projectId: "oslometgaming-58efa",
      storageBucket: "oslometgaming-58efa.appspot.com",
      messagingSenderId: "625418204912",
      appId: "1:625418204912:android:77e208b719c26019627435"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const docRef = db.doc("vault/ERULlo0c8KrxelgGtppg");

    docRef.get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById("game").innerHTML = `
          <h2>${data.name}</h2>
          <p><strong>Description:</strong> ${data.description || "N/A"}</p>
          <p><strong>Players:</strong> ${data.minPlayers || "?"} - ${data.maxPlayers || "?"}</p>
          <p><strong>Time:</strong> ${data.minMinutes || "?"} - ${data.maxMinutes || "?"} minutes</p>
          <p><strong>Shelf:</strong> ${data.shelfId}</p>
          <p><strong>Owner:</strong> ${data.owner}</p>
          <img src="${data.imageUrl}" alt="Game image" style="max-width: 300px;" />
        `;
      } else {
        document.getElementById("game").innerText = "Game not found.";
      }
    }).catch((error) => {
      console.error("Error fetching document:", error);
      document.getElementById("game").innerText = "Error loading game.";
    });
  </script>
</body>
</html>
