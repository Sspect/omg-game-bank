<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/game-card.css">
</head>

<script src="js/load-components.js"></script>
<body>
    <div id="header-container"></div>
    <main class="container py-4">
        <section class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <h2 class="h5 mb-0">Choose What To Display</h2>
                    <div class="d-flex gap-2">
                        <button id="selectAllDisplayFields" type="button" class="btn btn-sm btn-outline-light">Select All</button>
                        <button id="deselectAllDisplayFields" type="button" class="btn btn-sm btn-outline-secondary">Deselect All</button>
                    </div>
                </div>
                <div id="displayFieldControls" class="row g-2"></div>
            </div>
        </section>

        <section id="gamesList" class="row g-3"></section>
    </main>
    <script type="module" src="js/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>

</html>
